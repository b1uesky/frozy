<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Frozy · 冰雪魔法</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1a3a;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:block}

#topBtns{top:2vh;right:2.5vh;display:flex;pointer-events:auto}
.iconBtn{width:8vh;height:8vh;border-radius:50%;border:.3vh solid rgba(255,255,255,.6);background:rgba(20,50,110,.55);color:#fff;font-size:3.8vh;cursor:pointer}
#status{top:11vh;left:50%;transform:translateX(-50%);font-size:2.8vh;padding:.9vh 2.4vh;border-radius:5vh;background:rgba(10,30,80,.6);white-space:nowrap;transition:opacity .5s}
#hint{bottom:4vh;left:50%;transform:translateX(-50%);font-size:3.6vh;padding:1.3vh 3.4vh;border-radius:5vh;background:rgba(10,30,80,.62);transition:opacity .8s;white-space:nowrap;text-align:center}
#menu{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(70,130,210,.6),rgba(8,20,50,.94));overflow:auto;padding:3vh}
#menu.hide{display:none}
#menu h1{font-size:10vh;letter-spacing:.6vh;text-shadow:0 0 3vh #8fd8ff,0 0 1vh #fff}
#menu .sub{font-size:3.2vh;opacity:.92;margin-top:-1.5vh}
.modes{display:flex;flex-wrap:wrap;justify-content:center}
#menu>*{margin:1.4vh 0}
.modes>.mode{margin:0 1.5vh}
.opts>*{margin:.8vh 1.2vh}
#starIcon{margin-right:1.2vh}
#topBtns .iconBtn{margin-left:1.2vh}
.mode .em{margin-bottom:1.6vh}

.mode:hover,.mode:focus{transform:translateY(-.8vh) scale(1.04);box-shadow:0 0 4vh rgba(150,220,255,.85);outline:none}
.mode .em{font-size:10vh;line-height:1}
.mode.adv{border-color:#ffe27a;background:linear-gradient(160deg,rgba(255,226,122,.35),rgba(60,110,200,.45));box-shadow:0 0 3vh rgba(255,220,120,.45)}

#advBar span{margin:0 .9vh;opacity:.45}
#advBar span.on{opacity:1;transform:scale(1.15)}
#advBar span.done{opacity:.85}
#advBar b{margin-left:.6vh;font-size:2.8vh}
.opts{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;font-size:2.5vh;max-width:96vw}

.tog{border-radius:5vh;border:.3vh solid rgba(255,255,255,.55)}
.seg button.on,.tog.on{background:rgba(140,210,255,.55)}
select{font-size:2.3vh;padding:.9vh 1.2vh;border-radius:1vh;max-width:44vh;font-family:inherit}
.tips{font-size:2.2vh;opacity:.82;max-width:120vh;text-align:center;line-height:1.7}
#camRow{display:none}

<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>

<div class="hud" id="starBox"><span id="starIcon">⭐</span><span id="starNum">0</span></div>
<div class="hud" id="status" style="opacity:0"></div>
<div class="hud" id="advBar" style="display:none"></div>
<div class="hud" id="hint" style="opacity:0"></div>
<div class="hud" id="topBtns">
  <button class="iconBtn" id="btnFull" title="全屏">⛶</button>
  <button class="iconBtn" id="btnHome" title="回到菜单">🏠</button>
</div>

<div id="menu">
  <h1>❄️ 冰雪魔法 ❄️</h1>
  <div class="sub" id="subTitle">挥挥手，把一切都冻住！</div>
  <div class="sub" id="castleLine"></div>
  <div class="modes">

    <button class="mode" data-mode="snowman"><span class="em">⛄</span><span data-t="m4">堆雪人</span></button>
    <button class="mode" data-mode="free"><span class="em">❄️</span><span data-t="m3">画冰花</span></button>
  </div>
  <div class="opts">
    <div class="seg" id="inputSeg">
      <button data-v="camera" class="on">📷 摄像头挥手</button>
      <button data-v="pointer">🖱️ 鼠标 / 触屏</button>
    </div>
    <button class="tog on" id="togVideo">🪞 显示我自己</button>
    <button class="tog on" id="togDress"><span data-t="dressT">👑 变身</span></button>
    <button class="tog on" id="togMusic">🎵 音乐</button>
    <button class="tog on" id="togVoice">🗣️ 语音</button>
    <div class="seg" id="langSeg">
      <button data-v="zh" class="on">中文</button>
      <button data-v="en">English</button>
    </div>
  </div>
  <div class="opts"><span id="camRow" style="align-items:center;gap:1vh">📷 <select id="camSel"></select></span>
    <span id="voiceRow" style="display:none;align-items:center;gap:1vh">🗣️ <select id="voiceSel"></select> <button class="tog" id="voiceTest">▶️ 试听</button></span></div>
  <div class="tips" id="tips">
    家长小贴士：用 Chrome 打开，把电脑接到电视（HDMI 或投屏），摄像头放在电视上方或下方。<br>
    让孩子站在离摄像头 1.5～3 米的地方，摄像头能看到她的上半身就行。<br>
    手挥过目标 = 冰冻 · 快速挥手 = 发射冰晶 · <b>双手举过头顶 = 暴风雪！</b> · <b>拍手 = 冰冻冲击波</b> · 两个人可以一起玩<br>
    快捷键：空格 = 暴风雪，M = 显示/隐藏摄像头画面，Esc = 回菜单
  </div>
</div>

<script type="module">
// ---------- constants ----------
const MP_VER = '0.10.14';
const MP_CDN = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

const $ = s => document.querySelector(s);
const IS_TV = /web0s|webos|netcast|smart-?tv|tizen/i.test(navigator.userAgent);
const LITE = IS_TV;
const cv = $('#c'), ctx = cv.getContext('2d');
const video = $('#v');
let W = 0, H = 0, U = 1, DPR = 1;
let now = 0;

const S = {
  mode: 'menu', stars: 0, input: 'camera',
  showVideo: true, music: true, voice: true, lang: 'zh', dress: true, stage: '',
};
try { const saved = JSON.parse(localStorage.getItem('iceMagicPrefs') || '{}'); Object.assign(S, saved, { mode: 'menu', stars: 0 }); } catch (e) {}
if (IS_TV) { S.input = 'pointer'; S.showVideo = false; }
function savePrefs() { try { localStorage.setItem('iceMagicPrefs', JSON.stringify({ input: S.input, showVideo: S.showVideo, music: S.music, voice: S.voice, lang: S.lang, voiceName: S.voiceName || '', dress: S.dress })); } catch (e) {} }

// ---------- text ----------
const T = {
  zh: {
    sub: '挥挥手，把一切都冻住！', m1: '冻住小火怪', m2: '冰封小镇', m3: '画冰花', m0: '冰雪大冒险', m4: '堆雪人',
    st: [['第1关：赶走小火怪', '冻住 8 只小火怪'], ['第2关：冰封小镇', '把所有房子都变成冰'], ['第3关：火焰大王来啦！', '一直冻它，把它冻成大冰块！'], ['最后一关：建造冰雪城堡', '接住飘来的冰块，盖一座城堡']],
    stHint: ['🔥 手挥过小火怪，把它冻住！', '🏘️ 用手摸摸房子，把它冻成冰！', '🌋 一直用手冻火焰大王，掉下来的小火球也冻住！', '🏰 用手接住飘来的冰块！'],
    stDone: ['太棒啦！', '冰雪王国！', '赢啦！', '冰雪城堡！'],
    bossDone: '你打败了火焰大王！', castleDone: '冰雪城堡建好啦！你是最棒的冰雪小公主！',
    advDone: '冒险完成！', advDoneSay: n => `冒险完成！你得到了${n}颗星星！`,
    castles: n => n ? `🏰 你已经建了 ${n} 座冰雪城堡` : '',
    introSnow: '雪花飘下来啦！用手接住雪花，一起堆个雪人吧！', hintSnow: '⛄ 用手接住飘落的雪花，堆一个雪人！',
    snowDone: '雪人堆好啦！真可爱！', snowDoneShort: '雪人好啦！',
    combo: n => `${n} 连击！`, clap: '冰冻冲击波！', golden: '金色小火怪！快冻住它！', dressT: '👑 变身',
    freeze: ['冻住啦！', '好厉害！', '冰冻魔法！', '哇，变成冰块啦！', '真棒！'],
    count: n => `你有${n}颗星星啦！`,
    townDone: '整个小镇都变成冰雪王国啦！',
    blizzard: '暴风雪来啦！',
    introSprites: '小火怪来捣乱啦！挥挥手，用冰冻魔法冻住它们！',
    introTown: '挥挥手，把小镇变成冰雪王国吧！',
    introFree: '挥挥手画冰霜，手停住不动，就会长出冰花哦！',
    hintSprites: '🔥 手挥过小火怪，把它冻住！',
    hintTown: '🏘️ 用手摸摸房子，把它冻成冰！',
    hintFree: '❄️ 挥手画冰霜 · 手停住长冰花',
    hintBliz: '🙌 双手举过头顶 = 暴风雪！',
    hintBlizPtr: '👆 点一下/按 OK = 冰冻魔法 · 连按两下 = 暴风雪！',
    hintTownPtr: '🏘️ 用魔法棒指着房子，把它冻成冰！',
    camLoading: '⏳ 正在打开魔法眼睛（摄像头）…',
    camLooking: '🙋 站到摄像头前面，让我看到你！',
    camFound: '👀 找到你啦！',
    camFail: '📷 没打开摄像头，先用鼠标或触屏玩吧',
    mpFail: '⚠️ 魔法识别没加载成功（需要联网），先用鼠标或触屏玩吧',
    melt: '🧽',
  },
  en: {
    sub: 'Wave your hands and freeze everything!', m1: 'Freeze the Fire Imps', m2: 'Frozen Town', m3: 'Ice Painting', m0: 'Ice Adventure', m4: 'Build a Snowman',
    st: [['Level 1: Fire Imps', 'Freeze 8 fire imps'], ['Level 2: Frozen Town', 'Turn every house into ice'], ['Level 3: The Fire King!', 'Keep freezing him into a giant ice cube!'], ['Final: Ice Castle', 'Catch the ice blocks and build a castle']],
    stHint: ['🔥 Wave over the fire imps!', '🏘️ Touch the houses to freeze them!', '🌋 Keep freezing the Fire King and his fireballs!', '🏰 Catch the floating ice blocks!'],
    stDone: ['Great!', 'Ice Kingdom!', 'You won!', 'Ice Castle!'],
    bossDone: 'You beat the Fire King!', castleDone: 'Your ice castle is done! You are an amazing ice princess!',
    advDone: 'Adventure complete!', advDoneSay: n => `Adventure complete! You got ${n} stars!`,
    castles: n => n ? `🏰 You have built ${n} ice castle${n > 1 ? 's' : ''}` : '',
    introSnow: 'Snow is falling! Catch the snowflakes and build a snowman!', hintSnow: '⛄ Catch the snowflakes to build a snowman!',
    snowDone: 'The snowman is done! So cute!', snowDoneShort: 'Snowman!',
    combo: n => `${n} combo!`, clap: 'Ice shockwave!', golden: 'A golden fire imp! Freeze it!', dressT: '👑 Dress-up',
    freeze: ['Frozen!', 'Amazing!', 'Ice magic!', 'Wow, an ice cube!', 'Great job!'],
    count: n => `You have ${n} stars!`,
    townDone: 'The whole town is an ice kingdom now!',
    blizzard: 'Here comes the blizzard!',
    introSprites: 'The fire imps are making mischief! Wave your hands to freeze them!',
    introTown: 'Wave your hands and turn the town into ice!',
    introFree: 'Wave to paint frost. Hold your hand still to grow an ice flower!',
    hintSprites: '🔥 Wave over the fire imps to freeze them!',
    hintTown: '🏘️ Touch the houses to freeze them!',
    hintFree: '❄️ Wave to paint · Hold still for ice flowers',
    hintBliz: '🙌 Both hands up = Blizzard!',
    hintBlizPtr: '👆 Click / OK = ice magic · Double-click = Blizzard!',
    hintTownPtr: '🏘️ Point the wand at a house to freeze it!',
    camLoading: '⏳ Opening the magic eye (camera)…',
    camLooking: '🙋 Stand in front of the camera!',
    camFound: '👀 I can see you!',
    camFail: '📷 Camera not available — play with mouse or touch',
    mpFail: '⚠️ Motion tracking failed to load (needs internet) — use mouse or touch',
    melt: '🧽',
  }
};
const tr = k => T[S.lang][k];
const SC = () => S.mode === 'adventure' ? S.stage : S.mode;

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
const rgbCache = new Map();
function mix(a, b, t) {
  let A = rgbCache.get(a); if (!A) { A = hex2rgb(a); rgbCache.set(a, A); }
  let B = rgbCache.get(b); if (!B) { B = hex2rgb(b); rgbCache.set(b, B); }
  t = clamp(t, 0, 1);
  return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`;
}
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}

// ---------- canvas / layers ----------
let frost = document.createElement('canvas'), fctx = frost.getContext('2d');
function resize() {
  DPR = LITE ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
  const nw = Math.round(innerWidth * DPR), nh = Math.round(innerHeight * DPR);
  const old = frost;
  W = cv.width = nw; H = cv.height = nh; U = H / 100;
  const nf = document.createElement('canvas'); nf.width = W; nf.height = H;
  const nctx = nf.getContext('2d');
  if (old.width && old.height) nctx.drawImage(old, 0, 0, W, H);
  frost = nf; fctx = nctx;
  for (const s of sprites) { s.x = clamp(s.x, s.r, W - s.r); s.y = clamp(s.y, 14 * U, 84 * U); }
  bgStars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * 0.75, r: rand(0.15, 0.45), p: rand(0, 6) }));
}
let bgStars = [];

// ---------- audio ----------
let AC = null, master = null, musicGain = null, noiseBuf = null;
function ensureAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
      musicGain = AC.createGain(); musicGain.gain.value = 0.35; musicGain.connect(master);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, t0, dur, type = 'triangle', vol = 0.15, dest) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(t0, dur, vol, type, f0, f1, q = 1) {
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.05);
}
let lastTick = 0;
const sfx = {
  tick() { if (!AC || now - lastTick < 0.09) return; lastTick = now; tone(rand(2200, 3400), AC.currentTime, 0.12, 'sine', 0.035); },
  shard() { if (!AC) return; noise(AC.currentTime, 0.14, 0.07, 'bandpass', 2500, 7000, 3); },
  freeze() {
    if (!AC) return; const t = AC.currentTime;
    noise(t, 0.18, 0.18, 'highpass', 3000, 9000, 0.7);
    [1318.5, 1568, 1975.5, 2637].forEach((f, i) => tone(f, t + 0.03 + i * 0.06, 0.7, 'triangle', 0.12));
  },
  star() { if (!AC) return; const t = AC.currentTime; tone(1760, t, 0.35, 'sine', 0.12); tone(2217.5, t + 0.07, 0.4, 'sine', 0.1); },
  blizzard() {
    if (!AC) return; const t = AC.currentTime;
    noise(t, 2.2, 0.28, 'bandpass', 300, 2200, 0.8); noise(t + 0.6, 1.8, 0.18, 'bandpass', 2400, 500, 0.8);
    [2637, 2349, 1975.5, 1760, 1568, 1318.5, 1568, 1975.5, 2637].forEach((f, i) => tone(f, t + 0.1 + i * 0.09, 0.6, 'triangle', 0.07));
  },
  celebrate() {
    if (!AC) return; const t = AC.currentTime;
    [1046.5, 1318.5, 1568, 2093, 1568, 2093, 2637].forEach((f, i) => tone(f, t + i * 0.12, 0.6, 'triangle', 0.13));
  },
  flower() { if (!AC) return; const t = AC.currentTime; [1568, 1975.5, 2349, 3136].forEach((f, i) => tone(f, t + i * 0.08, 0.8, 'sine', 0.06)); },
};
// gentle original music-box loop (pentatonic)
const MELODY = [659, 784, 880, 988, 880, 784, 659, 587, 659, 784, 988, 1175, 988, 880, 784, 0,
                587, 659, 784, 880, 784, 659, 587, 523, 587, 659, 784, 659, 587, 523, 587, 0];
let musicIdx = 0, musicNext = 0;
function musicTick() {
  if (!AC || !S.music || S.mode === 'menu') return;
  const t = AC.currentTime;
  if (musicNext < t) musicNext = t + 0.05;
  while (musicNext < t + 0.2) {
    const f = MELODY[musicIdx % MELODY.length];
    if (f) { tone(f, musicNext, 1.2, 'sine', 0.05, musicGain); tone(f * 2, musicNext, 0.5, 'sine', 0.012, musicGain); }
    if (musicIdx % 8 === 0) tone(MELODY[musicIdx % MELODY.length] / 2 || 262, musicNext, 2.0, 'sine', 0.025, musicGain);
    musicIdx++; musicNext += 0.42;
  }
}

// ---------- speech ----------
// Prefer Mandarin (zh-CN) voices; avoid Cantonese (zh-HK) and rank Taiwanese (zh-TW) low.

      const hx = w.x + (w.x - e.x) * 0.3, hy = w.y + (w.y - e.y) * 0.3;
      const [sx, sy] = mapPt(hx, hy);
      feedHand('p' + i + side, sx, sy);
    }
    const nose = lm[0], lw = lm[15], rw = lm[16];
    const up = vis(lw) > 0.35 && vis(rw) > 0.35 && lw.y < nose.y - 0.02 && rw.y < nose.y - 0.02;
    armsUp[i] = up ? (armsUp[i] || 0) + fdt : 0;
    if (armsUp[i] > 0.3) { blizzard(); armsUp[i] = -3; }
  });
}

// ---------- update / draw ----------
function updateParticles(dt) {
  for (const p of parts) {
    p.vy += p.g * dt; const dr = Math.exp(-p.drag * dt); p.vx *= dr; p.vy *= dr;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const a of ambient) { a.y += a.vy * dt; a.x += Math.sin(now * 0.8 + a.ph) * U * 3 * dt; a.rot += dt * 0.5; if (a.y > H + 3 * U) Object.assign(a, newAmbient(false)); }
}
function drawParticles() {
  for (const p of parts) {
    const a = clamp(p.life / p.max * 1.5, 0, 1);
    if (p.type === 'flake') { ctx.globalAlpha = a; drawFlake(ctx, p.x, p.y, p.r, p.rot, p.col || '#ffffff'); }
    else if (p.type === 'spark') {
      ctx.globalAlpha = a; ctx.fillStyle = p.col || '#ffffff';
      const r = p.r * (0.6 + 0.4 * Math.sin(now * 20 + p.x));
      ctx.beginPath(); ctx.moveTo(p.x, p.y - r * 2); ctx.lineTo(p.x + r * 0.5, p.y - r * 0.5); ctx.lineTo(p.x + r * 2, p.y); ctx.lineTo(p.x + r * 0.5, p.y + r * 0.5); ctx.lineTo(p.x, p.y + r * 2); ctx.lineTo(p.x - r * 0.5, p.y + r * 0.5); ctx.lineTo(p.x - r * 2, p.y); ctx.lineTo(p.x - r * 0.5, p.y - r * 0.5); ctx.closePath(); ctx.fill();
    } else if (p.type === 'text') {
      ctx.globalAlpha = a; ctx.font = `800 ${p.size}px "PingFang SC","Microsoft YaHei",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = U * 0.8; ctx.strokeStyle = 'rgba(20,50,120,0.85)'; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
    } else if (p.type === 'ring') {
      const k = 1 - p.life / p.max; ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#e6f7ff'; ctx.lineWidth = U * 1.2 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + k), 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function drawBackground() {
  const camOn = camState === 'on' || (camStream && video.readyState >= 2);
  if (S.showVideo && camOn && video.readyState >= 2) {
    const r = videoRect();
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(video, r.ox, r.oy, r.dw, r.dh); ctx.restore();
    ctx.fillStyle = 'rgba(15,40,95,0.42)'; ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,25,70,0.6)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a1838'); g.addColorStop(0.6, '#1d3d78'); g.addColorStop(1, '#3a6cb0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const s of bgStars) { ctx.globalAlpha = 0.4 + 0.5 * Math.sin(now * 1.5 + s.p) ** 2; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r * U, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    // aurora
    if (!LITE) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 2; k++) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += W / 40) { const y = H * (0.22 + k * 0.08) + Math.sin(x / W * 6 + now * 0.4 + k * 2) * H * 0.05; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.strokeStyle = k ? 'rgba(120,255,220,0.10)' : 'rgba(140,200,255,0.12)'; ctx.lineWidth = H * 0.08; ctx.stroke();
    }
    ctx.restore();
    }
  }
}
let lastT = performance.now(), foundAt = 0;
function frame(tms) {
  const dt = Math.min(0.05, Math.max(0, (tms - lastT) / 1000)); lastT = tms; now += dt;
  detectPose();
  updateHands(dt); updateParticles(dt);
  const sc = SC();
  if (sc === 'sprites' || sc === 'boss') updateSprites(dt);
  if (sc === 'town') updateTown(dt);
  else if (sc === 'free') updateFree(dt);
  else if (sc === 'boss') updateBoss(dt);
  else if (sc === 'castle' || sc === 'snowman') updateItems(dt);
  if (S.mode === 'adventure') updateAdventure(dt);
  shake *= Math.exp(-dt * 9); if (shake < 0.05) shake = 0;
  updateShards(dt); updateFlyStars(dt);
  musicTick();
  // status
  if (S.mode !== 'menu' && S.input === 'camera') {
    if (camState === 'loading') setStatus(tr('camLoading'));
    else if (camState === 'on') {
      if (now - lastPoseSeen > 1.2) { setStatus(tr('camLooking')); foundAt = 0; }
      else { if (!foundAt) foundAt = now; setStatus(now - foundAt < 2.5 ? tr('camFound') : ''); }
    }
  }
  if (hintUntil && now > hintUntil) { hintEl.style.opacity = 0; hintUntil = 0; }

  // draw
  drawBackground();
  if (S.mode !== 'menu') drawDress();
  ctx.save();
  if (shake) ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
  ctx.save();
  for (const a of ambient) { ctx.globalAlpha = 0.55; drawFlake(ctx, a.x, a.y, a.r, a.rot, '#ffffff'); }
  ctx.restore();
  if (SC() === 'free') { ctx.drawImage(frost, 0, 0); for (const f of flowers) drawCrystal(ctx, f.x, f.y, f.R, f.rot, clamp(f.t / 1.1, 0, 1)); }
  if (SC() === 'town') drawTown();
  if (SC() === 'castle') drawCastle();
  if (SC() === 'snowman') drawSnowScene();
  if (SC() === 'sprites' || SC() === 'boss') for (const s of sprites) drawSprite(s);
  if (SC() === 'boss') drawBoss();
  if (SC() === 'castle' || SC() === 'snowman') drawItems();
  for (const sh of shards) drawShard(sh);
  drawParticles();
  ctx.restore();
  for (const h of hands.values()) if (S.mode !== 'menu') drawHand(h);
  for (const f of flyStars) { drawStar(ctx, f.x, f.y, 3 * U * (1 + 0.3 * Math.sin(f.t * 12)), f.t * 6); }
  if (flash > 0) { ctx.fillStyle = `rgba(220,240,255,${flash * 0.55})`; ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt * 1.6); }
  if (celebrateT > 0) {
    celebrateT -= dt; const k = 2.8 - celebrateT;
    const sc = k < 0.4 ? k / 0.4 * 1.15 : 1 + 0.05 * Math.sin(k * 6);
    ctx.save(); ctx.globalAlpha = clamp(celebrateT / 0.5, 0, 1); ctx.translate(W / 2, H * 0.42); ctx.scale(sc, sc);
    ctx.font = `800 ${14 * U}px "PingFang SC","Microsoft YaHei",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = U * 1.6; ctx.strokeStyle = 'rgba(30,70,150,0.9)'; ctx.strokeText(celebrateText, 0, 0);
    ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#8fdcff'; ctx.shadowBlur = 4 * U; ctx.fillText(celebrateText, 0, 0);
    ctx.restore();
  }
  drawTitle(dt);
  requestAnimationFrame(frame);
}

// ---------- mode control ----------
function startMode(m) {
  ensureAudio();
  $('#menu').classList.add('hide'); titleT = 0; comboN = 0;
  $('#btnMelt') && ($('#btnMelt').style.display = m === 'free' ? '' : 'none');
  if (S.input === 'camera' && camState !== 'on' && camState !== 'loading') startCamera($('#camSel').value || undefined);
  if (S.input !== 'camera') setStatus('');
  if (m === 'adventure') { startAdventure(); return; }
  $('#advBar').style.display = 'none';
  S.mode = m; S.stage = '';
  clearScene(); spawnTimer = 0;
  if (m === 'snowman') { snow.n = 0; snow.doneT = 0; snow.built = []; }
  if (m === 'snowman') { showHint(tr('hintSnow') + '   ' + tr(S.input !== 'camera' ? 'hintBlizPtr' : 'hintBliz'), 9); setTimeout(() => say(tr('introSnow'), true), 300); return; }
  if (m === 'town') genTown();
  if (m === 'free') { fctx.clearRect(0, 0, W, H); }
  $('#btnMelt') && ($('#btnMelt').style.display = m === 'free' ? '' : 'none');
  const intro = { sprites: 'introSprites', town: 'introTown', free: 'introFree' }[m];
  const hint = { sprites: 'hintSprites', town: 'hintTown', free: 'hintFree' }[m];
  const ptr = S.input !== 'camera';
  showHint(tr(ptr && m === 'town' ? 'hintTownPtr' : hint) + '   ' + tr(ptr ? 'hintBlizPtr' : 'hintBliz'), 9);
  setTimeout(() => say(tr(intro), true), 300);
  if (S.input === 'camera' && camState !== 'on' && camState !== 'loading') startCamera($('#camSel').value || undefined);
  if (S.input !== 'camera') setStatus('');
}
function goMenu() { ADV.token++; $('#advBar').style.display = 'none'; titleT = 0; $('#castleLine').textContent = tr('castles')(castlesBuilt); S.mode = 'menu'; $('#menu').classList.remove('hide'); setStatus(''); hintEl.style.opacity = 0; try { speechSynthesis.cancel(); } catch (e) {} }

document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => startMode(b.dataset.mode)));
$('#btnHome').addEventListener('click', goMenu);
$('#btnFull').addEventListener('click', () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} });
// melt button for free mode
const melt = document.createElement('button'); melt.className = 'iconBtn'; melt.id = 'btnMelt'; melt.title = '融化 / clear'; melt.textContent = '🧽'; melt.style.display = 'none';
melt.addEventListener('click', () => { meltT = 0.8; }); $('#topBtns').prepend(melt);

function segBind(id, key, after) {
  const el = $(id);
  const sync = () => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === S[key]));
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { S[key] = b.dataset.v; sync(); savePrefs(); after && after(); }));
  sync();
}
function togBind(id, key, after) {
  const el = $(id); const sync = () => el.classList.toggle('on', !!S[key]);
  el.addEventListener('click', () => { S[key] = !S[key]; sync(); savePrefs(); after && after(); }); sync();
}
function applyLang() {
  $('#subTitle').textContent = tr('sub'); $('#castleLine').textContent = tr('castles')(castlesBuilt);
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = tr(e.dataset.t));
}
segBind('#inputSeg', 'input', () => { if (S.input === 'camera') { ensureAudio(); startCamera(); } });
segBind('#langSeg', 'lang', () => { S.voiceName = ''; savePrefs(); applyLang(); fillVoiceSel(); });
togBind('#togVideo', 'showVideo'); togBind('#togDress', 'dress'); togBind('#togMusic', 'music'); togBind('#togVoice', 'voice');
applyLang();
if (IS_TV) {
  $('#inputSeg').style.display = 'none'; $('#togVideo').style.display = 'none'; $('#togDress').style.display = 'none';
  $('#tips').innerHTML = S.lang === 'zh'
    ? '电视遥控器就是魔法棒！Magic Remote 晃一晃会出现指针，对着屏幕挥就能冻住东西。<br>只有方向键也能玩：把光标移过去，按 OK = 发射会自动追踪的冰冻魔法 · 连按两下 OK 或按彩色键 = 暴风雪！'
    : 'The TV remote is a magic wand! Shake the Magic Remote to show the pointer, then wave.<br>Arrow keys work too: move the cursor and press OK = homing ice magic · Double OK or a color key = Blizzard!';
}

window.addEventListener('keydown', e => {
  if ([403, 404, 405, 406].includes(e.keyCode)) { e.preventDefault(); ensureAudio(); blizzard(); return; }
  if (e.keyCode === 461 && S.mode !== 'menu') { e.preventDefault(); goMenu(); return; }
  if ((e.key === 'Enter' || e.keyCode === 13) && S.mode !== 'menu') {
    let hx = W / 2, hy = H / 2; for (const [k, h] of hands) if (k[0] === 'm') { hx = h.x; hy = h.y; }
    iceBlast(hx, hy); return;
  }
  if (e.key === 'Escape') goMenu();
  else if (e.key === ' ') { e.preventDefault(); ensureAudio(); blizzard(); }
  else if (e.key === 'm' || e.key === 'M') { S.showVideo = !S.showVideo; $('#togVideo').classList.toggle('on', S.showVideo); savePrefs(); }
  else if (S.mode === 'menu' && ['1', '2', '3', '4', '5'].includes(e.key)) startMode(['adventure', 'sprites', 'town', 'snowman', 'free'][+e.key - 1]);
});
window.addEventListener('resize', resize);
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = fillVoiceSel; fillVoiceSel(); setTimeout(fillVoiceSel, 500); }
$('#voiceSel').addEventListener('change', e => { S.voiceName = e.target.value; savePrefs(); say(S.lang === 'zh' ? '冻住啦！好厉害！' : 'Frozen! Amazing!', true); });
$('#voiceTest').addEventListener('click', () => say(S.lang === 'zh' ? '小火怪来捣乱啦！挥挥手，用冰冻魔法冻住它们！' : 'Wave your hands and freeze the fire imps!', true));

resize(); initAmbient(); bumpStars();
requestAnimationFrame(frame);
window.__ice = { fakePose(arr) { poseScr = arr; poseT = now; camState = 'on'; }, S, ADV, enterStage, castle, snow, iceBlast, get boss() { return boss; }, get items() { return items; }, startMode, pickVoice, blizzard, feedHand, hands, get sprites() { return sprites; }, get buildings() { return buildings; } };
